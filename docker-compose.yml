services:
  user_service:
    build: ./services/user_service
    container_name: user-service
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./services/user_service/.env
    networks:
     default:
      aliases:
        - user-service  

  product_service:
    build: ./services/product_service
    container_name: product-service
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./services/product_service/.env
    networks:
     default:
      aliases:
        - product-service  

  order_service:
    build: ./services/order_service
    container_name: order-service
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./services/order_service/.env
    depends_on:
      - user_service
      - product_service
    networks:
      default:
        aliases:
          - order-service  

